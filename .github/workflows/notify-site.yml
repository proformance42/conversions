# Tell the website repository that the numbers here have changed, so it can
# open a pull request picking up this commit. That repository does the rest.
name: notify site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask cooking-conversions to update its pinned version
        env:
          # Not GITHUB_TOKEN: that one is scoped to this repository and cannot
          # dispatch to another. This needs a token with actions: write on
          # cooking-conversions.
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_SYNC_TOKEN is not set on this repository. Add it under Settings → Secrets and variables → Actions: a fine-grained personal access token with actions: write on proformance42/cooking-conversions."
            exit 1
          fi

          gh api repos/proformance42/cooking-conversions/dispatches \
            --method POST \
            --field event_type=conversions-updated \
            --field 'client_payload[sha]=${{ github.sha }}'
